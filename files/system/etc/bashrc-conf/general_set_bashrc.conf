# Functions
# Enable Git branch display in the prompt
parse_git_branch() {
  branch=$(git symbolic-ref --short HEAD 2>/dev/null)
  if [ -n "$branch" ]; then
    echo " ($branch)"
  fi
}

# Light blue color code
LIGHT_BLUE='\[\033[1;34m\]'
RESET_COLOR='\[\033[0m\]'
# Color codes
LIGHT_BLUE='\[\033[1;34m\]'   # Light blue
HOT_PINK='\[\033[1;35m\]'     # Magenta (closest to hot pink in terminal)
BRIGHT_CYAN='\[\033[1;36m\]'  # Bright cyan
RESET_COLOR='\[\033[0m\]'

# Set the colorful prompt
export PS1="${LIGHT_BLUE}\u${HOT_PINK}@\h:${BRIGHT_CYAN}\w\$(parse_git_branch) \$ ${RESET_COLOR}"